name: Tests

# The kit runtime and Cluster Info against stand-ins (no SDK, renderer or car needed).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kit/tools/test_runtime.js
      - run: node kit/tools/test_cluster_info_overlay.js
      - run: node kit/tools/test_cluster_info.js
